name: hefesto-comunidad-gateway
services:
  gateway:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    expose: ["8080"]
    volumes: [./ops/Caddyfile:/etc/caddy/Caddyfile:ro]
    networks: [default, comunidad]
networks:
  comunidad:
    external: true
    name: hefesto-comunidad
